<!doctype html>
<!--
  UI texts come from _locales/<lang>/messages.json (see src/i18n.js):
  a data-i18n attribute sets textContent, data-i18n-<attr> sets that attribute.
  The page stays invisible until the texts are applied (no flash of untranslated UI).
-->
<html lang="pl" class="i18n-pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ParaBene</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <img class="header__logo" src="../icons/icon48.png" alt="" width="36" height="36" />
        <div class="header__titles">
          <h1>ParaBene</h1>
          <p data-i18n="appTagline"></p>
        </div>
        <label class="switch switch--main" data-i18n-title="filterToggleTitle">
          <input type="checkbox" id="enabled" role="switch" data-i18n-aria-label="filterToggleLabel" />
          <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
          <span class="switch__state" id="enabled-state"></span>
        </label>
      </header>

      <!--
        The import window (popup.html?import=keywords|sites|settings) shows only this card: the toolbar
        popup closes while a file is being chosen, so an import runs in a small window of its own.
      -->
      <section class="card import-window" id="import-window" hidden>
        <div class="card__head">
          <h2 id="import-title"></h2>
        </div>
        <p class="hint hint--lead" id="import-desc"></p>
        <div class="dropzone" id="import-drop">
          <button type="button" class="btn btn--primary" id="import-choose" data-i18n="importChoose"></button>
          <p class="dropzone__text" data-i18n="importDropHint"></p>
        </div>
        <input type="file" id="import-file" accept=".json,.txt,application/json,text/plain" hidden />
        <p class="hint" id="import-status" role="status"></p>
        <div class="import" id="list-import-panel" role="group" aria-labelledby="import-title" hidden>
          <p class="import__summary" id="list-import-summary"></p>
          <div class="import__buttons">
            <button type="button" class="btn btn--primary" id="list-import-merge" data-i18n="keywordsImportMerge"></button>
            <button type="button" class="btn" id="list-import-replace" data-i18n="keywordsImportReplace"></button>
            <button type="button" class="link" id="list-import-cancel" data-i18n="importCancel"></button>
          </div>
        </div>
        <div class="import" id="settings-import-panel" role="group" data-i18n-aria-label="settingsImport" hidden>
          <p class="import__summary" id="settings-import-summary"></p>
          <ul class="import__warnings" id="settings-import-warnings"></ul>
          <p class="import__summary" data-i18n="settingsImportNote"></p>
          <div class="import__buttons">
            <button type="button" class="btn btn--primary" id="settings-import-apply" data-i18n="settingsImportApply"></button>
            <button type="button" class="link" id="settings-import-cancel" data-i18n="importCancel"></button>
          </div>
        </div>
      </section>

      <section class="card stat" aria-live="polite">
        <div class="stat__number" id="hidden-count">–</div>
        <div class="stat__text">
          <strong data-i18n="statTitle"></strong>
          <span id="stat-hint" data-i18n="statChecking"></span>
          <span class="stat__split" id="stat-split" hidden>
            <span class="source source--keyword"><span data-i18n="sourceKeyword"></span> <b id="stat-keyword">0</b></span>
            <span class="source source--ai"><span data-i18n="sourceAiText"></span> <b id="stat-ai-text">0</b></span>
            <span class="source source--image"><span data-i18n="sourceAiImage"></span> <b id="stat-ai-image">0</b></span>
            <span class="source source--learned" id="stat-passed-item" hidden><span data-i18n="sourcePassed"></span> <b id="stat-passed">0</b></span>
          </span>
        </div>
      </section>

      <!-- A layout change that could not be stored, while "Advanced" (and its status line) is collapsed. -->
      <p class="hint hint--error layout__error" id="layout-error" role="alert" hidden></p>

      <section class="card" data-section="sites">
        <div class="card__head">
          <h2 id="sites-title"><button type="button" class="card__toggle" aria-expanded="true" aria-controls="sites-body"><span data-i18n="sitesTitle"></span></button></h2>
          <span class="count" id="site-count">0</span>
        </div>
        <div class="card__body" id="sites-body">
          <form class="row" id="site-form" autocomplete="off">
            <input type="text" id="site-input" class="input" spellcheck="false" inputmode="url"
              data-i18n-placeholder="sitePlaceholder" data-i18n-aria-label="siteInputLabel" />
            <button type="submit" class="btn btn--primary" data-i18n="keywordAdd"></button>
          </form>
          <p class="hint" id="site-feedback" role="status" data-i18n="sitesHint"></p>
          <ul class="chips" id="site-list" aria-labelledby="sites-title"></ul>
          <p class="empty" id="site-empty" data-i18n="sitesEmpty" hidden></p>
          <div class="card__actions">
            <button type="button" class="link" id="exclude-current-site" data-i18n="excludeCurrentSite" hidden></button>
            <span class="card__actions-group">
              <button type="button" class="link" id="sites-export" data-i18n="keywordsExport"></button>
              <button type="button" class="link" id="sites-import" data-i18n="keywordsImport"></button>
            </span>
          </div>
        </div>
      </section>

      <section class="card" data-section="keywords">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="true" aria-controls="keywords-body"><span data-i18n="keywordsTitle"></span></button></h2>
          <span class="count" id="keyword-count">0</span>
        </div>
        <div class="card__body" id="keywords-body">
          <form class="row" id="keyword-form" autocomplete="off">
            <input
              type="text"
              id="keyword-input"
              class="input"
              maxlength="400"
              data-i18n-placeholder="keywordPlaceholder"
              data-i18n-aria-label="keywordInputLabel"
            />
            <button type="submit" class="btn btn--primary" data-i18n="keywordAdd"></button>
          </form>
          <p class="hint" id="keyword-feedback" data-i18n="keywordHint"></p>
          <ul class="chips" id="keyword-list" data-i18n-aria-label="keywordListLabel"></ul>
          <p class="empty" id="keyword-empty" data-i18n="keywordEmpty" hidden></p>
          <div class="card__actions">
            <button type="button" class="link" id="restore-defaults" data-i18n="restoreDefaults"></button>
            <span class="card__actions-group">
              <button type="button" class="link" id="keywords-export" data-i18n="keywordsExport"></button>
              <button type="button" class="link" id="keywords-import" data-i18n="keywordsImport"></button>
            </span>
          </div>
        </div>
      </section>

      <section class="card" data-section="engine">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="true" aria-controls="engine-body"><span data-i18n="engineTitle"></span></button></h2>
        </div>
        <div class="card__body" id="engine-body">

          <div class="engine engine--on">
            <div class="engine__text">
              <strong data-i18n="engineKeywordsName"></strong>
              <span data-i18n="engineKeywordsDesc"></span>
            </div>
            <span class="pill" data-i18n="engineActive"></span>
          </div>

          <div class="engine">
            <div class="engine__text">
              <strong data-i18n="engineAiName"></strong>
              <span data-i18n="engineAiDesc"></span>
            </div>
            <label class="switch" data-i18n-title="engineAiToggleLabel">
              <input type="checkbox" id="ai-enabled" role="switch" data-i18n-aria-label="engineAiToggleLabel" />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            </label>
          </div>

          <div class="ai" id="ai-settings">
            <label class="ai__label" for="ai-protocol" data-i18n="aiProtocolLabel"></label>
            <select id="ai-protocol" class="input ai__select">
              <option value="simple" data-i18n="aiProtocol_simple"></option>
              <option value="basal" data-i18n="aiProtocol_basal"></option>
              <option value="builtin" data-i18n="aiProtocol_builtin"></option>
            </select>
            <div class="model" id="ai-model" hidden>
              <label class="ai__label" for="ai-model-select" data-i18n="aiModelLabel"></label>
              <select id="ai-model-select" class="input ai__select"></select>
              <p class="hint" id="ai-model-note"></p>
              <p class="hint model__status" id="ai-model-status" role="status"></p>
              <progress class="model__progress" id="ai-model-progress" max="100" value="0" aria-labelledby="ai-model-status" hidden></progress>
              <button type="button" class="btn btn--primary" id="ai-model-download" hidden></button>
              <p class="hint" data-i18n="aiBuiltinHint"></p>
            </div>
            <label class="ai__label" for="ai-endpoint" id="ai-endpoint-label" data-i18n="aiEndpointLabel"></label>
            <div class="row">
              <input
                type="url"
                id="ai-endpoint"
                class="input input--mono"
                spellcheck="false"
                placeholder="http://localhost:8000/classify"
              />
              <button type="button" class="btn" id="ai-test" data-i18n="aiTest"></button>
            </div>
            <p class="hint" id="ai-status" data-i18n="aiHint"></p>

            <label class="ai__label ai__label--section" for="ai-mode" data-i18n="aiModeLabel"></label>
            <select id="ai-mode" class="input ai__select">
              <option value="both" data-i18n="aiMode_both"></option>
              <option value="ai" data-i18n="aiMode_ai"></option>
            </select>
          </div>

          <div class="engine engine--split">
            <div class="engine__text">
              <strong data-i18n="engineImagesName"></strong>
              <span data-i18n="engineImagesDesc"></span>
            </div>
            <label class="switch" data-i18n-title="engineImagesToggleLabel">
              <input type="checkbox" id="ai-images-enabled" role="switch" data-i18n-aria-label="engineImagesToggleLabel" />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            </label>
          </div>

          <div class="ai" id="ai-images-settings">
            <label class="ai__label" for="ai-images-endpoint" data-i18n="aiImagesEndpointLabel"></label>
            <div class="row">
              <input
                type="url"
                id="ai-images-endpoint"
                class="input input--mono"
                spellcheck="false"
                placeholder="http://localhost:8011"
              />
              <button type="button" class="btn" id="ai-images-test" data-i18n="aiTest"></button>
            </div>
            <p class="hint" id="ai-images-status" data-i18n="aiImagesHint"></p>
          </div>

          <div class="ai ai--follow" id="basal-settings">
            <label class="ai__label" for="ai-sensitivity" data-i18n="aiSensitivityLabel"></label>
            <select id="ai-sensitivity" class="input ai__select">
              <option value="low" data-i18n="aiSensitivity_low"></option>
              <option value="medium" data-i18n="aiSensitivity_medium"></option>
              <option value="high" data-i18n="aiSensitivity_high"></option>
            </select>
            <fieldset class="topics">
              <legend class="ai__label" data-i18n="aiTopicsLabel"></legend>
              <div class="topics__grid" id="ai-topics">
                <label class="topic"><input type="checkbox" value="accident" /><span data-i18n="category_accident"></span></label>
                <label class="topic"><input type="checkbox" value="violence" /><span data-i18n="category_violence"></span></label>
                <label class="topic"><input type="checkbox" value="death" /><span data-i18n="category_death"></span></label>
                <label class="topic"><input type="checkbox" value="profanity" /><span data-i18n="category_profanity"></span></label>
                <label class="topic"><input type="checkbox" value="politics" /><span data-i18n="category_politics"></span></label>
                <label class="topic"><input type="checkbox" value="clickbait" /><span data-i18n="category_clickbait"></span></label>
              </div>
              <p class="hint hint--error" id="ai-topics-empty" data-i18n="aiTopicsEmpty" hidden></p>
            </fieldset>
          </div>
        </div>
      </section>

      <section class="card" data-section="learn">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="true" aria-controls="learn-body"><span data-i18n="learnTitle"></span></button></h2>
          <span class="count" id="learn-count">0</span>
        </div>
        <div class="card__body" id="learn-body">
          <div class="engine engine--first">
            <div class="engine__text">
              <strong data-i18n="learnToggleName"></strong>
              <span data-i18n="learnDesc"></span>
            </div>
            <label class="switch" data-i18n-title="learnToggleName">
              <input type="checkbox" id="learn-enabled" role="switch" data-i18n-aria-label="learnToggleName" />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            </label>
          </div>
          <div class="ai" id="learn-settings">
            <label class="ai__label" for="learn-similarity" data-i18n="learnSimilarityLabel"></label>
            <select id="learn-similarity" class="input ai__select">
              <option value="strict" data-i18n="learnSimilarity_strict"></option>
              <option value="medium" data-i18n="learnSimilarity_medium"></option>
              <option value="loose" data-i18n="learnSimilarity_loose"></option>
            </select>
            <p class="hint" id="learn-status" data-i18n="learnOff"></p>
          </div>
          <details class="learned" id="learn-details">
            <summary data-i18n="learnShowList"></summary>
            <ul class="learned__list" id="learn-list" data-i18n-aria-label="learnListLabel"></ul>
          </details>
          <div class="log__actions learned__actions">
            <button type="button" class="link" id="learn-clear" data-i18n="learnClear"></button>
          </div>
        </div>
      </section>

      <section class="card" data-section="log">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="true" aria-controls="log-body"><span data-i18n="logTitle"></span></button></h2>
          <span class="count" id="log-count">0</span>
        </div>
        <div class="card__body" id="log-body">
          <div class="engine engine--first">
            <div class="engine__text">
              <strong data-i18n="logToggleName"></strong>
              <span data-i18n="logDesc"></span>
            </div>
            <label class="switch" data-i18n-title="logToggleName">
              <input type="checkbox" id="log-enabled" role="switch" data-i18n-aria-label="logToggleName" />
              <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
            </label>
          </div>
          <p class="hint" id="log-status" data-i18n="logEmpty"></p>
          <div class="log__actions">
            <button type="button" class="btn" id="log-open" data-i18n="logOpenStats"></button>
          </div>
        </div>
      </section>

      <section class="card" id="backup-card" data-section="backup">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="true" aria-controls="backup-body"><span data-i18n="backupTitle"></span></button></h2>
        </div>
        <div class="card__body" id="backup-body">
          <p class="hint hint--lead" data-i18n="backupDesc"></p>
          <div class="backup__actions">
            <button type="button" class="btn" id="settings-export" data-i18n="settingsExport"></button>
            <button type="button" class="btn" id="settings-import" data-i18n="settingsImport"></button>
          </div>
          <p class="hint" id="backup-status" role="status"></p>
        </div>
      </section>

      <section class="card card--collapsed" id="advanced-card">
        <div class="card__head">
          <h2><button type="button" class="card__toggle" aria-expanded="false" aria-controls="advanced-body"><span data-i18n="advancedTitle"></span></button></h2>
        </div>
        <div class="card__body" id="advanced-body" hidden>
          <h3 class="subhead" id="section-order-title" data-i18n="sectionOrderTitle"></h3>
          <p class="hint hint--lead" data-i18n="sectionOrderHint"></p>
          <ol class="order" id="section-order" aria-labelledby="section-order-title"></ol>
          <p class="hint" data-i18n="sectionCollapseHint"></p>
          <div class="card__actions">
            <button type="button" class="link" id="layout-reset" data-i18n="layoutReset"></button>
          </div>
          <p class="hint layout__status" id="layout-status" role="status"></p>

          <!-- Another basal version for the built-in model (src/config.js, "Another basal version"). -->
          <h3 class="subhead subhead--section" id="custom-model-title" data-i18n="customModelTitle"></h3>
          <p class="hint hint--lead hint--warning" data-i18n="customModelWarning"></p>
          <label class="ai__label" for="custom-model-url" data-i18n="customModelUrlLabel"></label>
          <div class="row">
            <input type="url" id="custom-model-url" class="input input--mono" spellcheck="false" autocomplete="off" />
            <button type="button" class="btn" id="custom-model-check" data-i18n="customModelCheck"></button>
          </div>
          <p class="hint" data-i18n="customModelUrlHint"></p>
          <p class="hint" id="custom-model-info" role="status"></p>
          <label class="topic custom__consent" id="custom-model-consent-row" hidden>
            <input type="checkbox" id="custom-model-consent" /><span data-i18n="customModelConsent"></span>
          </label>
          <button type="button" class="btn btn--primary custom__start" id="custom-model-start" hidden></button>
          <p class="hint model__status custom__status" id="custom-model-status" role="status"></p>
          <progress class="model__progress" id="custom-model-progress" max="100" value="0" aria-labelledby="custom-model-status" hidden></progress>
          <p class="hint" id="custom-model-result"></p>
          <div class="backup__actions custom__actions">
            <button type="button" class="btn btn--primary" id="custom-model-keep" hidden></button>
            <button type="button" class="btn" id="custom-model-discard" hidden></button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <span id="version">v1.0.0</span>
        <label class="lang">
          <span class="visually-hidden" data-i18n="languageLabel"></span>
          <svg class="lang__icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3" />
            <path d="M1.5 8h13M8 1.5c-2.2 2.4-2.2 10.6 0 13M8 1.5c2.2 2.4 2.2 10.6 0 13" fill="none" stroke="currentColor" stroke-width="1.3" />
          </svg>
          <select id="language" class="lang__select"></select>
        </label>
        <a href="https://github.com/danieljarosik/parabene" target="_blank" rel="noopener noreferrer">GitHub</a>
      </footer>
    </main>

    <script src="../src/config.js"></script>
    <script src="../src/i18n.js"></script>
    <script src="../src/backup.js"></script>
    <script src="../src/store.js"></script>
    <script src="log-card.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
